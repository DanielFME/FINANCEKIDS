
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar sesión - Finance Kids</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">

    <style>
        .logout-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .logout-card {
            width: 100%;
            max-width: 460px;
            padding: 42px 32px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(2, 15, 94, 0.35);
            text-align: center;
        }

        .logout-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #eaf5ff;
            color: #072ac8;
            font-size: 40px;
        }

        .logout-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: #072ac8;
            margin-bottom: 15px;
        }

        .logout-description {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .logout-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .logout-button {
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .logout-button:hover {
            transform: translateY(-2px);
        }

        .btn-confirm {
            border: none;
            background: #072ac8;
            color: #ffffff;
        }

        .btn-confirm:hover {
            background: #020f5e;
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(7, 42, 200, 0.25);
        }

        .btn-cancel {
            border: 2px solid #a2d6f9;
            background: #eaf5ff;
            color: #072ac8;
        }

        .btn-cancel:hover {
            background: #a2d6f9;
            color: #020f5e;
        }

        @media (max-width: 480px) {
            .logout-card {
                padding: 32px 22px;
            }

            .logout-title {
                font-size: 1.65rem;
            }
        }
    </style>
</head>

<body>
    <!-- Estrellas animadas de Finance Kids -->
    <div class="stars-container" aria-hidden="true">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <main class="logout-page">
        <section class="logout-card">

            <div class="logout-icon">
                <i class="bi bi-box-arrow-right"></i>
            </div>

            <h1 class="logout-title">
                ¿Quieres cerrar sesión?
            </h1>

            <p class="logout-description">
                ¡Esperamos verte pronto!
                Tu aventura financiera continuará
                cuando regreses.
            </p>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}

                <div class="logout-actions">
                    <button type="submit" class="logout-button btn-confirm">
                        <i class="bi bi-box-arrow-right"></i>
                        Sí, cerrar sesión
                    </button>

                    <a href="{% url 'index' %}" class="logout-button btn-cancel">
                        <i class="bi bi-arrow-left-circle"></i>
                        No, quiero quedarme
                    </a>
                </div>
            </form>

        </section>
    </main>
</body>
</html>
