{% csrf_token %}
<div id="fk-root">
  <div id="fk-saludo" hidden>¡Guau! Soy Firu 🐶<br>¿Aprendemos de dinero?</div>
  <button id="fk-fab" type="button" aria-label="Hablar con Firu, el perrito del ahorro" data-dog></button>

  <section id="fk-panel" hidden aria-label="Chat con Firu">
    <header id="fk-cabecera">
      <div id="fk-avatar" data-dog></div>
      <div id="fk-titulo"><strong>Firu</strong><span>Tu perrito del ahorro</span></div>
      <button id="fk-voz" type="button" class="fk-btn-cab" aria-label="Activar o silenciar la voz de Firu" title="Voz de Firu">🔊</button>
      <button id="fk-cambiar" type="button" class="fk-btn-cab" aria-label="Cambiar la voz de Firu" title="Cambiar la voz de Firu">🗣️</button>
      <button id="fk-cerrar" type="button" class="fk-btn-cab" aria-label="Cerrar chat">✕</button>
    </header>
    <div id="fk-chat" aria-live="polite"></div>
    <div id="fk-chips"></div>
    <div id="fk-aviso" hidden></div>
    <div id="fk-entrada">
      <button id="fk-mic" type="button" aria-label="Hablarle a Firu" title="Hablarle a Firu">🎤</button>
      <input id="fk-input" maxlength="300" placeholder="Escríbele a Firu..." autocomplete="off">
      <button id="fk-enviar" type="button" aria-label="Enviar">➤</button>
    </div>
  </section>
</div>

<style>
  #fk-root {
    position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    font-family: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
    --fk-main: #43a047; --fk-oscuro: #2e7d32; --fk-claro: #fff3e0; --fk-texto: #3b2a1a;
  }
  #fk-root * { box-sizing: border-box; }

  #fk-fab {
    width: 84px; height: 84px; border-radius: 50%; padding: 4px; display: block; margin-left: auto;
    border: 4px solid var(--fk-main); background: #fffdf7; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
    animation: fk-bote 2.6s ease-in-out infinite;
  }
  #fk-fab svg, #fk-avatar svg { width: 100%; height: 100%; display: block; }

  #fk-saludo {
    position: absolute; right: 6px; bottom: 98px; width: max-content; max-width: 210px;
    background: #fff; border: 2px solid var(--fk-main); border-radius: 16px 16px 4px 16px;
    padding: 8px 12px; font-size: 14px; font-weight: 700; color: var(--fk-texto);
    box-shadow: 0 4px 12px rgba(0,0,0,.2); cursor: pointer; animation: fk-aparece .4s ease-out;
  }
  #fk-saludo[hidden] { display: none; }

  #fk-panel {
    position: absolute; right: 0; bottom: 100px; width: min(350px, calc(100vw - 32px));
    display: flex; flex-direction: column; overflow: hidden;
    background: #fffdf7; border: 3px solid var(--fk-main); border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: fk-aparece .25s ease-out;
  }
  #fk-panel[hidden] { display: none; }

  #fk-cabecera {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: #fff;
    background: linear-gradient(135deg, var(--fk-main), #7cb342);
  }
  #fk-avatar { width: 46px; height: 46px; border-radius: 50%; background: #fffdf7; padding: 2px; flex: none; }
  #fk-titulo { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  #fk-titulo strong { font-size: 17px; }
  #fk-titulo span { font-size: 12px; opacity: .92; }
  .fk-btn-cab {
    width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
    background: rgba(255,255,255,.25); color: #fff; font-size: 16px;
  }
  .fk-btn-cab[hidden] { display: none; }

  #fk-chat {
    height: min(290px, 45vh); overflow-y: auto; padding: 12px; background: #fffaf0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .fk-fila { display: flex; gap: 8px; align-items: flex-end; }
  .fk-fila.fk-yo { justify-content: flex-end; }
  .fk-cara {
    width: 30px; height: 30px; border-radius: 50%; background: #ffe0b2; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .fk-burbuja {
    max-width: 78%; padding: 9px 12px; font-size: 15px; line-height: 1.35;
    color: var(--fk-texto); word-wrap: break-word; white-space: pre-wrap;
  }
  .fk-perro .fk-burbuja { background: var(--fk-claro); border: 2px solid #ffcc80; border-radius: 16px 16px 16px 4px; }
  .fk-yo .fk-burbuja { background: var(--fk-main); color: #fff; border-radius: 16px 16px 4px 16px; }

  .fk-puntos { display: flex; gap: 4px; padding: 4px 2px; }
  .fk-puntos span { width: 8px; height: 8px; border-radius: 50%; background: #ef9a3c; animation: fk-punto 1s infinite ease-in-out; }
  .fk-puntos span:nth-child(2) { animation-delay: .15s; }
  .fk-puntos span:nth-child(3) { animation-delay: .3s; }

  #fk-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; background: #fffaf0; }
  #fk-chips:empty { display: none; }
  .fk-chip {
    border: 2px solid var(--fk-main); background: #fff; color: var(--fk-oscuro); cursor: pointer;
    border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .fk-chip:hover { background: #e8f5e9; }

  #fk-aviso {
    padding: 6px 12px; font-size: 13px; font-weight: 700; color: #6d4c00;
    background: #fff8e1; border-top: 1px solid #ffe082;
  }
  #fk-aviso[hidden] { display: none; }

  #fk-entrada { display: flex; gap: 8px; padding: 10px 12px; background: #fffdf7; border-top: 2px dashed #ffcc80; }
  #fk-input {
    flex: 1; min-width: 0; padding: 10px 14px; border: 2px solid #ccc; border-radius: 999px;
    font-size: 15px; font-family: inherit; outline: none;
  }
  #fk-input:focus { border-color: var(--fk-main); }
  #fk-enviar, #fk-mic {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; cursor: pointer;
    color: #fff; font-size: 18px;
  }
  #fk-enviar { background: var(--fk-main); }
  #fk-enviar:disabled, #fk-mic:disabled { background: #bdbdbd; cursor: not-allowed; }
  #fk-mic { background: #fb8c00; }
  #fk-mic[hidden] { display: none; }
  #fk-mic.fk-escuchando { background: #e53935; animation: fk-latido 1s ease-in-out infinite; }

  .fk-dog { overflow: visible; transform-origin: 50% 90%; }
  .fk-oreja { transform-box: fill-box; transform-origin: 50% 0%; animation: fk-oreja 3.2s ease-in-out infinite; }
  .fk-ojo { transform-box: fill-box; transform-origin: center; animation: fk-parpadeo 4s infinite; }
  .fk-boca { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); }
  .fk-habla .fk-boca { animation: fk-hablar .28s ease-in-out infinite alternate; }
  .fk-pensando { animation: fk-inclina 1.1s ease-in-out infinite alternate; }
  .fk-atento { animation: fk-atento .8s ease-in-out infinite alternate; }

  @keyframes fk-bote { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes fk-aparece { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fk-punto { 0%, 80%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
  @keyframes fk-oreja { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
  @keyframes fk-parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes fk-hablar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  @keyframes fk-inclina { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  @keyframes fk-atento { from { transform: scale(1); } to { transform: scale(1.06); } }
  @keyframes fk-latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  @media (prefers-reduced-motion: reduce) {
    #fk-root * { animation: none !important; }
  }
</style>

<script>
(function () {
  var DOG = '<svg class="fk-dog" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Firu el perrito">'
    + '<g transform="rotate(14 20 40)"><ellipse class="fk-oreja" cx="20" cy="40" rx="12" ry="25" fill="#8d5a2b"/></g>'
    + '<g transform="rotate(-14 80 40)"><ellipse class="fk-oreja" cx="80" cy="40" rx="12" ry="25" fill="#8d5a2b"/></g>'
    + '<circle cx="50" cy="54" r="33" fill="#f2c48d"/>'
    + '<circle cx="35" cy="49" r="9" fill="#8d5a2b" opacity=".3"/>'
    + '<ellipse cx="50" cy="68" rx="19" ry="15" fill="#fff4e0"/>'
    + '<circle cx="28" cy="64" r="4" fill="#ffab91" opacity=".5"/><circle cx="72" cy="64" r="4" fill="#ffab91" opacity=".5"/>'
    + '<g class="fk-ojo"><circle cx="37" cy="50" r="5.2" fill="#2b1b10"/><circle cx="38.8" cy="48.2" r="1.7" fill="#fff"/></g>'
    + '<g class="fk-ojo"><circle cx="63" cy="50" r="5.2" fill="#2b1b10"/><circle cx="64.8" cy="48.2" r="1.7" fill="#fff"/></g>'
    + '<ellipse cx="50" cy="61" rx="6.5" ry="4.8" fill="#2b1b10"/>'
    + '<path d="M50 65 V69 M50 69 Q44 76 38 71 M50 69 Q56 76 62 71" stroke="#2b1b10" stroke-width="2.2" fill="none" stroke-linecap="round"/>'
    + '<g class="fk-boca"><ellipse cx="50" cy="75" rx="6.5" ry="5" fill="#7a1f2b"/><ellipse cx="50" cy="77.5" rx="3.6" ry="2.4" fill="#ff7a93"/></g>'
    + '<path d="M28 84 Q50 97 72 84" stroke="#e53935" stroke-width="6" fill="none" stroke-linecap="round"/>'
    + '<circle cx="50" cy="93.5" r="4.2" fill="#fbc02d" stroke="#f9a825" stroke-width="1"/>'
    + '</svg>';

  var PREGUNTAS = ["¿Qué es ahorrar? 🐷", "¿Para qué sirve el dinero? 💵", "¿Qué es un presupuesto? 📝", "¿Cómo ahorro mi mesada? 🪙"];
  var SALUDO = "¡Guau guau! Soy Firu 🐶 Te ayudo a entender el dinero. ¿Qué quieres aprender hoy?";

  var root = document.getElementById("fk-root");
  var panel = document.getElementById("fk-panel");
  var saludo = document.getElementById("fk-saludo");
  var chat = document.getElementById("fk-chat");
  var chips = document.getElementById("fk-chips");
  var aviso = document.getElementById("fk-aviso");
  var input = document.getElementById("fk-input");
  var btn = document.getElementById("fk-enviar");
  var btnVoz = document.getElementById("fk-voz");
  var btnCambiar = document.getElementById("fk-cambiar");
  var btnMic = document.getElementById("fk-mic");
  var iniciado = false;
  var ocupado = false;
  var avisoTimer = null;

  root.querySelectorAll("[data-dog]").forEach(function (el) { el.innerHTML = DOG; });

  function estado(clase, activo) {
    root.querySelectorAll(".fk-dog").forEach(function (d) { d.classList.toggle(clase, activo); });
  }

  function mostrarAviso(texto, ms) {
    aviso.textContent = texto;
    aviso.hidden = false;
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { aviso.hidden = true; }, ms || 4500);
  }

  /* ================= VOZ DE FIRU (gratis, del navegador) ================= */
  var synth = window.speechSynthesis || null;
  var vozActiva = true;
  var vozGuardada = "";
  try {
    if (localStorage.getItem("fk-voz") === "off") vozActiva = false;
    vozGuardada = localStorage.getItem("fk-voz-nombre") || "";
  } catch (e) {}

  function puntaje(v) {
    var n = v.name.toLowerCase();
    var l = v.lang.replace("_", "-").toLowerCase();
    if (l.indexOf("es") !== 0) return -1;
    var p = 0;
    if (/natural|neural/.test(n)) p += 100;
    if (/online/.test(n)) p += 40;
    if (/google/.test(n)) p += 30;
    if (/microsoft/.test(n)) p += 10;
    if (/^es-(co|mx|us|419)$/.test(l)) p += 15;
    if (/compact|espeak/.test(n)) p -= 30;
    return p;
  }

  function listaVoces() {
    if (!synth) return [];
    return (synth.getVoices() || [])
      .filter(function (v) { return puntaje(v) >= 0; })
      .sort(function (a, b) { return puntaje(b) - puntaje(a); });
  }

  function elegirVoz() {
    var lista = listaVoces();
    if (!lista.length) return null;
    if (vozGuardada) {
      for (var i = 0; i < lista.length; i++) if (lista[i].name === vozGuardada) return lista[i];
    }
    return lista[0];
  }

  function textoParaVoz(t) {
    return String(t)
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "")
      .replace(/•/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function callar() {
    if (synth) synth.cancel();
    estado("fk-habla", false);
  }

  function hablar(texto) {
    if (!synth || !vozActiva) return false;
    var limpio = textoParaVoz(texto);
    if (!limpio) return false;
    synth.cancel();
    var v = elegirVoz();
    var natural = v && /natural|neural/i.test(v.name);
    var partes = limpio.match(/[^.!?]+[.!?]*/g) || [limpio];
    partes.forEach(function (parte, idx) {
      var u = new SpeechSynthesisUtterance(parte.trim());
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "es-419"; }
      u.rate = natural ? 1.0 : 0.95;
      u.pitch = natural ? 1.1 : 1.2;
      if (idx === 0) u.onstart = function () { estado("fk-habla", true); };
      if (idx === partes.length - 1) {
        u.onend = function () { estado("fk-habla", false); };
      }
      u.onerror = function () { estado("fk-habla", false); };
      synth.speak(u);
    });
    return true;
  }

  function desbloquear() {
    if (!synth || !vozActiva) return;
    try {
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      synth.speak(u);
    } catch (e) {}
  }

  function pintarVoz() {
    btnVoz.textContent = vozActiva ? "🔊" : "🔇";
    btnVoz.setAttribute("aria-pressed", vozActiva ? "true" : "false");
    btnVoz.title = vozActiva ? "Silenciar a Firu" : "Activar la voz de Firu";
  }

  if (!synth || typeof SpeechSynthesisUtterance === "undefined") {
    synth = null;
    vozActiva = false;
    btnVoz.hidden = true;
    btnCambiar.hidden = true;
  } else {
    pintarVoz();
    btnVoz.addEventListener("click", function () {
      vozActiva = !vozActiva;
      try { localStorage.setItem("fk-voz", vozActiva ? "on" : "off"); } catch (e) {}
      if (!vozActiva) callar(); else desbloquear();
      pintarVoz();
    });
    btnCambiar.addEventListener("click", function () {
      var lista = listaVoces();
      if (lista.length < 2) {
        mostrarAviso("En este dispositivo solo hay una voz en español.");
        return;
      }
      var actual = elegirVoz();
      var pos = lista.indexOf(actual);
      var sig = lista[(pos + 1) % lista.length];
      vozGuardada = sig.name;
      try { localStorage.setItem("fk-voz-nombre", sig.name); } catch (e) {}
      if (!vozActiva) {
        vozActiva = true;
        try { localStorage.setItem("fk-voz", "on"); } catch (e) {}
        pintarVoz();
      }
      mostrarAviso("Voz: " + sig.name, 5000);
      hablar("¡Guau! Así sueno ahora. ¿Te gusta mi voz?");
    });
  }

  /* ================= MICRÓFONO (el niño le habla a Firu) ================= */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var reconocedor = null;
  var escuchando = false;

  function pararMic() {
    if (reconocedor && escuchando) { try { reconocedor.stop(); } catch (e) {} }
  }

  function escuchar() {
    if (!SR || ocupado) return;
    if (escuchando) { pararMic(); return; }
    callar();
    var final = "";
    var hayError = false;
    reconocedor = new SR();
    reconocedor.lang = "es-CO";
    reconocedor.interimResults = true;
    reconocedor.continuous = false;
    reconocedor.maxAlternatives = 1;

    reconocedor.onstart = function () {
      escuchando = true;
      btnMic.classList.add("fk-escuchando");
      btnMic.textContent = "⏹";
      input.value = "";
      input.placeholder = "Te escucho... 🐾";
      estado("fk-atento", true);
    };
    reconocedor.onresult = function (ev) {
      var texto = "";
      for (var i = 0; i < ev.results.length; i++) {
        texto += ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final = texto;
      }
      input.value = texto;
    };
    reconocedor.onerror = function (ev) {
      hayError = true;
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        mostrarAviso("Necesito permiso para usar el micrófono. Actívalo en el candado de la barra de direcciones.", 7000);
      } else if (ev.error === "no-speech") {
        mostrarAviso("No te escuché. ¡Intenta de nuevo y habla un poquito más fuerte!");
      } else if (ev.error === "audio-capture") {
        mostrarAviso("No encuentro un micrófono en este dispositivo.", 6000);
      } else if (ev.error === "network") {
        mostrarAviso("No pude conectar el micrófono. Revisa tu internet.", 6000);
      } else if (ev.error !== "aborted") {
        mostrarAviso("El micrófono no funcionó. Puedes escribirle a Firu.", 6000);
      }
    };
    reconocedor.onend = function () {
      escuchando = false;
      btnMic.classList.remove("fk-escuchando");
      btnMic.textContent = "🎤";
      input.placeholder = "Escríbele a Firu...";
      estado("fk-atento", false);
      var dicho = (final || input.value).trim();
      if (!hayError && dicho) {
        enviar(dicho);
      } else {
        input.value = "";
      }
    };
    try {
      reconocedor.start();
    } catch (e) {
      mostrarAviso("No pude encender el micrófono. Intenta otra vez.");
    }
  }

  if (!SR) {
    btnMic.hidden = true;
  } else {
    btnMic.addEventListener("click", escuchar);
  }

  /* ================= CHAT ================= */
  function bajar() { chat.scrollTop = chat.scrollHeight; }

  function limpiar(t) {
    return String(t || "")
      .replace(/\*\*/g, "")
      .replace(/^\s*[\*\-]\s+/gm, "• ")
      .replace(/#+\s*/g, "")
      .trim();
  }

  function mensaje(rol, texto) {
    var fila = document.createElement("div");
    fila.className = "fk-fila " + (rol === "yo" ? "fk-yo" : "fk-perro");
    if (rol !== "yo") {
      var cara = document.createElement("div");
      cara.className = "fk-cara";
      cara.textContent = "🐶";
      fila.appendChild(cara);
    }
    var b = document.createElement("div");
    b.className = "fk-burbuja";
    b.textContent = texto;
    fila.appendChild(b);
    chat.appendChild(fila);
    bajar();
    return { fila: fila, burbuja: b };
  }

  function escribiendo() {
    var m = mensaje("perro", "");
    m.burbuja.innerHTML = '<div class="fk-puntos"><span></span><span></span><span></span></div>';
    return m;
  }

  function escribirPoco(burbuja, texto) {
    var i = 0;
    var paso = Math.max(1, Math.ceil(texto.length / 150));
    estado("fk-habla", true);
    var t = setInterval(function () {
      i += paso;
      burbuja.textContent = texto.slice(0, i);
      bajar();
      if (i >= texto.length) {
        clearInterval(t);
        estado("fk-habla", false);
      }
    }, 22);
  }

  function mostrarChips() {
    chips.innerHTML = "";
    PREGUNTAS.forEach(function (p) {
      var c = document.createElement("button");
      c.type = "button";
      c.className = "fk-chip";
      c.textContent = p;
      c.addEventListener("click", function () { enviar(p); });
      chips.appendChild(c);
    });
  }

  function abrir() {
    panel.hidden = false;
    saludo.hidden = true;
    if (!iniciado) {
      iniciado = true;
      mensaje("perro", SALUDO);
      mostrarChips();
      desbloquear();
      hablar(SALUDO);
    }
    input.focus();
  }

  function cerrar() {
    panel.hidden = true;
    pararMic();
    callar();
  }

  async function enviar(textoDirecto) {
    var texto = (textoDirecto || input.value).trim();
    if (!texto || ocupado) return;
    ocupado = true;
    btn.disabled = true;
    btnMic.disabled = true;
    chips.innerHTML = "";
    callar();
    desbloquear();
    mensaje("yo", texto);
    input.value = "";
    var pensando = escribiendo();
    estado("fk-pensando", true);

    var respuesta;
    try {
      var tokenEl = root.querySelector("[name=csrfmiddlewaretoken]") || document.querySelector("[name=csrfmiddlewaretoken]");
      var r = await fetch("/api/tutor/", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": tokenEl.value },
        body: JSON.stringify({ pregunta: texto })
      });
      var data = await r.json();
      respuesta = limpiar(data.respuesta) || "¡Guau! No supe qué responder. ¿Me lo preguntas de otra forma?";
    } catch (e) {
      respuesta = "¡Ups! Algo falló. ¿Lo intentamos de nuevo? 🐾";
    }

    estado("fk-pensando", false);
    pensando.fila.remove();
    var m = mensaje("perro", "");
    if (vozActiva && synth) {
      m.burbuja.textContent = respuesta;
      bajar();
      hablar(respuesta);
    } else {
      escribirPoco(m.burbuja, respuesta);
    }
    ocupado = false;
    btn.disabled = false;
    btnMic.disabled = false;
    input.focus();
  }

  document.getElementById("fk-fab").addEventListener("click", function () { panel.hidden ? abrir() : cerrar(); });
  document.getElementById("fk-cerrar").addEventListener("click", cerrar);
  saludo.addEventListener("click", abrir);
  btn.addEventListener("click", function () { enviar(); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") enviar(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrar(); });
  window.addEventListener("beforeunload", function () { pararMic(); callar(); });

  setTimeout(function () { if (panel.hidden) saludo.hidden = false; }, 1500);
  setTimeout(function () { saludo.hidden = true; }, 10000);
})();
</script>
