services:
  - type: web
    name: financekids
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn financekids.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://financekids.onrender.com
      - key: USE_SQLITE
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: financekids-db
          property: connectionString

databases:
  - name: financekids-db
    databaseName: financekids
    user: financekids
